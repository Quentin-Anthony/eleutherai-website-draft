<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t">
  <title id="t">Three open layers: datasets, training and evaluation code, and models released with everything needed to reproduce them</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="560" fill="#10151d"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- MODELS layer -->
    <rect x="200" y="72" width="480" height="108" rx="8" fill="#0b1018" stroke="#78b8ee" stroke-width="2"/>
    <text x="230" y="112" fill="#f4f5f7" font-size="22" font-weight="700">Models</text>
    <text x="230" y="146" fill="#c4c9d1" font-size="17">Pythia · GPT-NeoX-20B · Comma</text>
    <g transform="translate(560 92)" fill="#78b8ee">
      <circle cx="20" cy="34" r="6"/><circle cx="60" cy="14" r="6"/><circle cx="60" cy="54" r="6"/><circle cx="100" cy="34" r="6"/>
      <path d="M20 34L60 14M20 34L60 54M60 14L100 34M60 54L100 34" stroke="#78b8ee" stroke-width="2" fill="none" opacity=".7"/>
    </g>
    <!-- CODE layer -->
    <rect x="200" y="226" width="480" height="108" rx="8" fill="#0b1018" stroke="#3a5b7a" stroke-width="2"/>
    <text x="230" y="266" fill="#f4f5f7" font-size="22" font-weight="700">Code</text>
    <text x="230" y="300" fill="#c4c9d1" font-size="17">GPT-NeoX · lm-evaluation-harness</text>
    <g transform="translate(560 252)" stroke="#78b8ee" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M22 10L6 28L22 46"/><path d="M98 10L114 28L98 46"/><path d="M70 6L50 50"/>
    </g>
    <!-- DATA layer -->
    <rect x="200" y="380" width="480" height="108" rx="8" fill="#0b1018" stroke="#3a5b7a" stroke-width="2"/>
    <text x="230" y="420" fill="#f4f5f7" font-size="22" font-weight="700">Data</text>
    <text x="230" y="454" fill="#c4c9d1" font-size="17">The Pile · The Common Pile</text>
    <g transform="translate(560 402)" fill="#78b8ee" opacity=".9">
      <rect x="0" y="0" width="30" height="22" rx="3"/><rect x="38" y="0" width="30" height="22" rx="3" opacity=".65"/><rect x="76" y="0" width="30" height="22" rx="3" opacity=".4"/>
      <rect x="0" y="30" width="30" height="22" rx="3" opacity=".65"/><rect x="38" y="30" width="30" height="22" rx="3" opacity=".4"/><rect x="76" y="30" width="30" height="22" rx="3"/>
    </g>
    <!-- connectors -->
    <g stroke="#78b8ee" stroke-width="2" fill="none">
      <path d="M440 380V342"/><path d="M432 350l8-8 8 8"/>
      <path d="M440 226V188"/><path d="M432 196l8-8 8 8"/>
    </g>
    <text x="456" y="364" fill="#7f8997" font-size="14">train and evaluate with</text>
    <text x="456" y="210" fill="#7f8997" font-size="14">released with checkpoints and data order</text>
    <!-- left rail -->
    <text x="120" y="126" fill="#7f8997" font-size="14" text-anchor="end">public</text>
    <text x="120" y="280" fill="#7f8997" font-size="14" text-anchor="end">open source</text>
    <text x="120" y="434" fill="#7f8997" font-size="14" text-anchor="end">openly licensed</text>
    <path d="M150 90V470" stroke="#27313f" stroke-width="2" stroke-dasharray="2 6"/>
    <circle cx="150" cy="126" r="5" fill="#78b8ee"/><circle cx="150" cy="280" r="5" fill="#78b8ee"/><circle cx="150" cy="434" r="5" fill="#78b8ee"/>
  </g>
</svg>
